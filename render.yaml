services:
  - type: web
    name: sarcosistema-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DEBUG
        value: "false"
      - key: RENDER
        value: "true"
      - key: IMAGENES_STORAGE_DIR
        value: /var/data/imagenes
      - key: RADIOLOGY_STORAGE_DIR
        value: /var/data/radiologia
    disk:
      name: sarcosistema-files
      mountPath: /var/data
      sizeGB: 10
