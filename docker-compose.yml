# Configuracion comun + inicio coordinado de servicios (seccion 8: Mantenimiento)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hospital_sarcobamba
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital_dev_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      WHISPER_MODEL_DIR: /app/.models/whisper
      IMAGENES_STORAGE_DIR: /app/storage/imagenes
      # Dentro del contenedor, localhost es el propio backend, no PostgreSQL.
      DATABASE_URL: postgresql+asyncpg://hospital:hospital_dev_password@db:5432/hospital_sarcobamba
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - whisper_models:/app/.models/whisper
      # Archivos clinicos de examenes complementarios (fuera de la base).
      - storage_imagenes:/app/storage/imagenes
  # Ollama puede aÃ±adirse mÃ¡s adelante si se aprueba la asistencia de redacciÃ³n.
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

volumes:
  db_data:
  whisper_models:
  storage_imagenes:
